; Dev-only: Xdebug step debugging.
; Mounted into the wordpress container at /usr/local/etc/php/conf.d/.
; VS Code runs in this same container, so the debugger client is on localhost.
xdebug.mode = debug
xdebug.start_with_request = yes
xdebug.client_host = localhost
xdebug.client_port = 9003
; Don't log "could not connect" on every request when no debugger is listening.
xdebug.log_level = 0
